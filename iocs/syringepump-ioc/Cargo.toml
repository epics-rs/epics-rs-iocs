# SyringePump IOC binary. Wires up all three pump families from
# epics-modules/SyringePump: Teledyne ISCO D/H-series (StreamDevice, via
# stream-rs) plus ISCO and Vindum (Modbus-only upstream,
# wired directly against epics-modbus-rs's drvModbusAsynConfigure + ported
# db templates -- no driver code of their own).

[package]
name = "syringepump-ioc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
stream-rs = { workspace = true }
epics-rs = { workspace = true, features = ["asyn", "bridge"] }
modbus-rs = { workspace = true, features = ["ioc"] }
