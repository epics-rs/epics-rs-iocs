[package]
name = "ur-robot-ioc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ur-robot = { path = "../../../drivers/ur-robot" }
epics-rs = { workspace = true, features = ["asyn", "bridge"] }
epics-libcom-rs = { workspace = true }
asyn-rs = { workspace = true, features = ["epics"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
ioc-conventions = { path = "../../../tools/ioc-conventions" }
