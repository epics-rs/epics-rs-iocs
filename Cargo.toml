# Single source of truth for the epics-rs crate versions every driver/IOC
# consumes. Bump here once per epics-rs release instead of editing each crate.
# Per-crate feature sets stay in the crates (features are additive over these).
[workspace.dependencies]
# epics-rs 0.27.0 (released): ports consume the released version instead of
# the main branch. 0.24.3 -> 0.25.2 was the breaking step for this workspace
# and the code here already carries it: `create_port_runtime` became fallible
# (a port whose actor thread the OS refuses is now an error rather than a
# handle to a port that can never run a request),
# `CommandContext::runtime_handle` was replaced by `bridge()` so iocsh
# commands spawn on either async backend, and `PvaClient::pvmonitor_handle`
# gained an `on_conn` callback.
#
# 0.26.0 carried five breaking changes, none of which this workspace touches:
# they are internal to epics-ca-rs (`check_write_element_count` renamed
# `check_write_request`), epics-base-rs (`AcfCell` newtype on
# `IocApplication.acf`; the record snapshot's `description` is `PvString`),
# epics-pva-rs and epics-bridge-rs (per-op credential fields collapse into a
# shared `ClientCreds`). Drivers and IOCs here consume `epics_rs::asyn` and
# `epics_rs::ad_core`, which are unchanged. What reached us was the CA client
# fix: a cross-typed put (e.g. `Long(1)` to an ENUM field) used to ship the
# caller's variant under a native-type header and write a silently wrong
# value; it now routes through `convert_to(native_type)` first.
#
# 0.26.1 is a patch release with no API change, and two of its fixes were
# found in this workspace. `RequestOp::CallParamCallbacks` now fires an
# interrupt for every address list the batch wrote -- the upstream half of
# the RTDE receive fix in drivers/ur-robot, whose `by_addr` split is
# redundant against 0.26.1 rather than wrong. And an NTNDArray frame no
# longer boxes its pixels one `ScalarValue` at a time, which takes the two
# PVA plugins on the D405/D435i IOCs from 135% to 14% of one core at
# 640x480 @ 15 fps. `ad-plugins-rs` also moves to rust-hdf5 0.5.1.
#
# 0.26.2 carries the asyn halves the ur-robot work depends on — devBusyAsyn
# (busy records over asynInt32, driver-clearable) and `ParamSetValue::Status`
# (poll-thread COMM alarm pushes) — plus the aSub FTx/FTVx cell typing and
# per-line db/acf macro expansion. Additive API only.
#
# 0.27.0 lands the 2026-08-23 C-parity round: 42 public API breaks (18
# removals, 24 signature changes), measured item-by-item in the epics-rs
# repo's doc/breaking-2026-08-23.md. Exactly one lands here:
# `recgbl::rec_gbl_set_sevr` now returns C's raise bool, which makes
# drivers/vac's local `raised` recomputation in `set_sevr` redundant --
# collapsed to return the upstream value. Nothing else in the removal or
# signature tables is referenced by this workspace (`wait_blocking`'s
# timeout is now honoured, but no crate here calls it). Behavioral: a
# record's process cycle exits through `end_process_cycle` on every path,
# and asyn bounds blocking waits by the caller's deadline.
#
# 0.28.0 gathers the 2026-08-25 C-parity round; no API break reaches this
# workspace. It includes the four fixes this workspace's adaptation audit
# sent upstream (epics-rs PR #91): iocsh tokenize takes blanks before `(`
# as call syntax, db_loader resolves an externally-registered record
# type's own menu tables, `AdIoc::new` registers busy/sseq itself (the
# per-IOC registrations those AD mains carried are dropped alongside this
# bump), and commonPlugins.cmd passes NAME=FFT1. Behavioral parity that
# lands here: device support binds before init_record, one MacroTable
# spans a whole include tree, and every PUT renders in the destination
# field's shape.
#
# 0.28.1 is a patch release with no API change. What reaches this
# workspace is boot-time behavior: `call_param_callbacks` is gated on
# interruptAccept so parameters a driver seeds before iocInit reach CA
# clients once records are wired, record init defers to the iocInit
# barrier, and the CA server snapshots record fields under the record's
# dbScanLock analogue. busy/sseq registration moved from `AdIoc::new`
# into `register_all_plugins` — `AdIoc::new` calls it unconditionally,
# so the AD mains here still need no registrations of their own.
#
# 0.29.0's one break -- five epics-base-rs entries lose their `depth`
# argument -- reaches nothing here: `process_record_with_links`,
# `process_record_readback`, `process_record_continuation` and
# `read_link_value_soft` have no caller in this tree. What 0.29.x lands
# is record behavior: monitor state advances on every value-class post
# even when `mlis` is empty, so a move that finished with no `.DMOV`
# subscriber no longer leaves the next subscriber's 1->0 transition
# comparing equal and dropped.
#
# 0.30.0 is the first bump since 0.27.0 whose breaks reach code here --
# five lines in three crates. `NDArrayDriverBase::attributes` and
# `attr_functions` fold into one `DriverAttributes` that `ADDriverBase`
# owns too, so drivers/ad/timepix3's `ADDriverBase` literal gains an
# `attributes` field; the record trait's `multi_input_links` returns
# `&'static [(&'static str, &'static str)]`, which drivers/vac's digitel
# impl returns directly since its table is already a literal; and
# `ProcessContext<'a>` carries a lifetime, drops `tsel` and borrows
# `dtyp` rather than owning a `String`, which drivers/opcua's test
# context follows. `PvDatabase::get_record` returning `Arc<RecordCell>`,
# the `CommonFields` amsg/namsg/bkpt retyping (drivers/vac's literals
# compile unchanged) and macLib's move to
# `epics_libcom_rs::runtime::mac_lib` reach nothing here. Behavioral:
# `Task::enqueue` no longer takes a callback-ring slot, so the asyn boot
# flush stops overflowing the 2000-slot ring about one boot in six and
# leaving I/O Intr records permanently without updates; a process cycle
# costs 0.65 us against 0.29.3's 7.7 us; and an `ADDriverBase` detector
# can load an attributes file at all.
#
# 0.30.1 carries the seven fixes filed from this workspace's measComp port.
# Its one break lands widely: `register_port(name, handle)` takes the trace
# from the handle the driver was bound to, so the third argument leaves 38
# calls here, `register_modbus_commands` loses its trace argument too, and
# the `TraceManager` locals and parameters that only fed them go with them
# (quadem's configure commands, pmacAsynIPConfigure, microepsilon's
# `configure`, the ur-robot and ip `register` helpers). Behavioral: a failed
# async device write alarms, `create_monitor_set` works after iocInit, a
# plain I/O Intr record rings every callback, and
# `register_asyn_device_support` registers the asyn shell commands on
# `PortManager::global()`.
#
# 0.30.2 carries five more fixes this port filed. Its one break is
# `DeviceSupportContext`, which gains a `record_type` the factory gate
# reads: ten test contexts in yokogawa-gm10/-mw100 name their record
# ("ai", and "bo" for the two poll triggers). Behavioral: one output write on a non-blocking port reaches the
# driver once instead of twice, `asynSetTrace*` writes the named port's own
# trace, `PortServices::new` builds its own trace instead of rebinding the
# one it is passed, a waveform with DTYP `asyn*ArrayOut` and its link in INP
# writes (C's `asynXxxArrayWfOut` shape, which `WaveGen<n>UserWF` uses), and
# the universal factory refuses a (record type, DTYP) pair no `device()`
# line declares, as a DTYP put does in C. That last one drops records this
# workspace had bound only because the factory took anything: DTYP
# `asynOctet` where C declares `asynOctetRead`/`asynOctetWrite`, and an ai
# reading `asynOctetRead`.
#
# Cargo.lock pins the exact patch release.
epics-rs = "0.30.2"
asyn-rs = "0.30.2"
ad-core-rs = "0.30.2"
ad-plugins-rs = "0.30.2"
# Modbus TCP/RTU/ASCII driver (drvModbusAsyn port).
modbus-rs = { version = "0.30.2", package = "epics-modbus-rs" }
# mcaRecord + soft device support (epics-modules/mca's mcaRecord.c). No
# epics-rs "mca" feature exists yet, so drivers/mca depends on this
# standalone published crate directly.
mca-rs = "0.30.2"
