# Single source of truth for the epics-rs crate versions every driver/IOC
# consumes. Bump here once per epics-rs release instead of editing each crate.
# Per-crate feature sets stay in the crates (features are additive over these).
[workspace.dependencies]
# epics-rs 0.26.0 (released): ports consume the released version instead of
# the main branch. 0.24.3 -> 0.25.2 was the breaking step for this workspace
# and the code here already carries it: `create_port_runtime` became fallible
# (a port whose actor thread the OS refuses is now an error rather than a
# handle to a port that can never run a request),
# `CommandContext::runtime_handle` was replaced by `bridge()` so iocsh
# commands spawn on either async backend, and `PvaClient::pvmonitor_handle`
# gained an `on_conn` callback.
#
# 0.26.0 carries five breaking changes, none of which this workspace touches:
# they are internal to epics-ca-rs (`check_write_element_count` renamed
# `check_write_request`), epics-base-rs (`AcfCell` newtype on
# `IocApplication.acf`; the record snapshot's `description` is `PvString`),
# epics-pva-rs and epics-bridge-rs (per-op credential fields collapse into a
# shared `ClientCreds`). Drivers and IOCs here consume `epics_rs::asyn` and
# `epics_rs::ad_core`, which are unchanged. What does reach us is the CA
# client fix: a cross-typed put (e.g. `Long(1)` to an ENUM field) used to ship
# the caller's variant under a native-type header and write a silently wrong
# value; it now routes through `convert_to(native_type)` first.
#
# Cargo.lock pins the exact patch release.
epics-rs = "0.26.0"
asyn-rs = "0.26.0"
ad-core-rs = "0.26.0"
ad-plugins-rs = "0.26.0"
# Modbus TCP/RTU/ASCII driver (drvModbusAsyn port).
modbus-rs = { version = "0.26.0", package = "epics-modbus-rs" }
# mcaRecord + soft device support (epics-modules/mca's mcaRecord.c). No
# epics-rs "mca" feature exists yet, so drivers/mca depends on this
# standalone published crate directly.
mca-rs = "0.26.0"
