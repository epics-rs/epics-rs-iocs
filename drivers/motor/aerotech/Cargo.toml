# Aerotech Ensemble motor controller, ASCII over an asyn octet port. No vendor
# library — builds on any host.

[package]
name = "motor-aerotech"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
epics-libcom-rs = { workspace = true }
epics-rs = { workspace = true, features = ["asyn", "motor"] }
motor-common = { path = "../common" }
epics-seq-rs = { workspace = true }

[build-dependencies]
epics-snc-rs = { workspace = true }

[dev-dependencies]
motor-common = { path = "../common", features = ["testing"] }
